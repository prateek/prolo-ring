<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="-apple-system, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="600" height="420" rx="18" fill="#17191d"/><text x="22" y="38" font-size="24" font-weight="700" fill="#6d28d9" text-anchor="start">Air</text><circle cx="546" cy="32" r="5.5" fill="#6d28d9"/><circle cx="562" cy="32" r="5.5" fill="#6d28d9"/><circle cx="578" cy="32" r="5.5" fill="#6d28d9"/><text x="22" y="60" font-size="13" font-weight="400" fill="#9aa1ac" text-anchor="start">Left and hold: hold on, lift off.</text><text x="22" y="78" font-size="11.5" font-weight="400" fill="#f2f3f5" text-anchor="start">Swipe left and hold on the Modstrip.</text><text x="22" y="110" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="start">1</text><text x="40" y="110" font-size="12" font-weight="400" fill="#f2f3f5" text-anchor="start">Tilt the hand until the charging port faces down.</text><text x="22" y="132" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="start">2</text><text x="40" y="132" font-size="12" font-weight="400" fill="#f2f3f5" text-anchor="start">All three LEDs light for two seconds: armed.</text><text x="22" y="154" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="start">3</text><text x="40" y="154" font-size="12" font-weight="400" fill="#f2f3f5" text-anchor="start">Move sharply. LED 3 flicks once when recognized.</text><text x="22" y="186" font-size="10.5" font-weight="700" fill="#9aa1ac" text-anchor="start" letter-spacing="1.2">ASSIGNED</text><text x="22" y="206" font-size="12" font-weight="400" fill="#9aa1ac" text-anchor="start">Nothing yet in this profile.</text><text x="350" y="220" font-size="10.5" font-weight="700" fill="#9aa1ac" text-anchor="start" letter-spacing="1.2">SWITCH MODE</text><rect x="350" y="230" width="4" height="13" rx="2" fill="#3a3f47"/><text x="362" y="240" font-size="10.5" font-weight="400" fill="#9aa1ac" text-anchor="start">← swipe</text><text x="450" y="240" font-size="12" font-weight="500" fill="#f2f3f5" text-anchor="start">Cursor</text><rect x="350" y="248" width="4" height="13" rx="2" fill="#3a3f47"/><text x="362" y="258" font-size="10.5" font-weight="400" fill="#9aa1ac" text-anchor="start">swipe →</text><text x="450" y="258" font-size="12" font-weight="500" fill="#f2f3f5" text-anchor="start">Navigation</text><rect x="350" y="266" width="4" height="13" rx="2" fill="#3a3f47"/><text x="362" y="276" font-size="10.5" font-weight="400" fill="#9aa1ac" text-anchor="start">swipe → hold</text><text x="450" y="276" font-size="12" font-weight="500" fill="#f2f3f5" text-anchor="start">Touch</text><rect x="350" y="284" width="4" height="13" rx="2" fill="#6d28d9"/><text x="362" y="294" font-size="10.5" font-weight="400" fill="#9aa1ac" text-anchor="start">← swipe hold</text><text x="450" y="294" font-size="12" font-weight="700" fill="#6d28d9" text-anchor="start">Air</text><text x="22" y="406" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start">1× tap + hold reconnects or unlocks · 2× pairs · palm locks</text></svg>
