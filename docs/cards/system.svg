<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="600" height="420" font-family="-apple-system, Helvetica, Arial, sans-serif"><rect x="0" y="0" width="600" height="420" rx="18" fill="#17191d"/><text x="22" y="38" font-size="24" font-weight="700" fill="#f2f3f5" text-anchor="start">Modstrip</text><text x="22" y="60" font-size="13" font-weight="400" fill="#9aa1ac" text-anchor="start">Tap N times, then press and hold within two seconds.</text><rect x="22" y="86" width="14" height="10" rx="2" fill="#e4e4e7"/><rect x="40" y="86" width="14" height="10" rx="2" fill="#3a3f47"/><rect x="58" y="86" width="14" height="10" rx="2" fill="#3a3f47"/><text x="84" y="96" font-size="12.5" font-weight="700" fill="#f2f3f5" text-anchor="start">1× tap + hold</text><text x="190" y="96" font-size="11.5" font-weight="400" fill="#f2f3f5" text-anchor="start">Reconnect or switch host; unlocks</text><text x="190" y="109" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start" font-style="italic">one: back on</text><rect x="22" y="122" width="14" height="10" rx="2" fill="#e4e4e7"/><rect x="40" y="122" width="14" height="10" rx="2" fill="#e4e4e7"/><rect x="58" y="122" width="14" height="10" rx="2" fill="#3a3f47"/><text x="84" y="132" font-size="12.5" font-weight="700" fill="#f2f3f5" text-anchor="start">2× tap + hold</text><text x="190" y="132" font-size="11.5" font-weight="400" fill="#f2f3f5" text-anchor="start">Open a 60-second pairing window</text><text x="190" y="145" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start" font-style="italic">two: new</text><rect x="22" y="158" width="14" height="10" rx="2" fill="#e4e4e7"/><rect x="40" y="158" width="14" height="10" rx="2" fill="#e4e4e7"/><rect x="58" y="158" width="14" height="10" rx="2" fill="#e4e4e7"/><text x="84" y="168" font-size="12.5" font-weight="700" fill="#f2f3f5" text-anchor="start">3× tap + hold</text><text x="190" y="168" font-size="11.5" font-weight="400" fill="#f2f3f5" text-anchor="start">App Status on or off; reboots, and the mouse stops unti…</text><text x="190" y="181" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start" font-style="italic">three: Studio</text><rect x="22" y="194" width="14" height="10" rx="2" fill="#ef4444"/><rect x="40" y="194" width="14" height="10" rx="2" fill="#3a3f47"/><rect x="58" y="194" width="14" height="10" rx="2" fill="#3a3f47"/><text x="84" y="204" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start">4× tap + hold</text><text x="190" y="204" font-size="11.5" font-weight="400" fill="#fca5a5" text-anchor="start">Shut down; only the charger wakes it</text><text x="190" y="217" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start" font-style="italic">four: lights out</text><rect x="22" y="230" width="14" height="10" rx="2" fill="#ef4444"/><rect x="40" y="230" width="14" height="10" rx="2" fill="#ef4444"/><rect x="58" y="230" width="14" height="10" rx="2" fill="#3a3f47"/><text x="84" y="240" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start">5× tap + hold</text><text x="190" y="240" font-size="11.5" font-weight="400" fill="#fca5a5" text-anchor="start">Factory reset: clears bonds, settings, and profile</text><text x="190" y="253" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start" font-style="italic">five: wipe it all</text><rect x="22" y="266" width="14" height="10" rx="2" fill="#ef4444"/><rect x="40" y="266" width="14" height="10" rx="2" fill="#ef4444"/><rect x="58" y="266" width="14" height="10" rx="2" fill="#ef4444"/><text x="84" y="276" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start">6× tap + hold</text><text x="190" y="276" font-size="11.5" font-weight="400" fill="#fca5a5" text-anchor="start">Firmware update mode</text><text x="190" y="289" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start" font-style="italic">six: fix</text><rect x="22" y="302" width="14" height="10" rx="2" fill="#ef4444"/><rect x="40" y="302" width="14" height="10" rx="2" fill="#3a3f47"/><rect x="58" y="302" width="14" height="10" rx="2" fill="#3a3f47"/><text x="84" y="312" font-size="12.5" font-weight="700" fill="#f87171" text-anchor="start">7× tap + hold</text><text x="190" y="312" font-size="11.5" font-weight="400" fill="#fca5a5" text-anchor="start">Desktop or mobile navigation style; forget the ring on…</text><text x="190" y="325" font-size="10" font-weight="400" fill="#9aa1ac" text-anchor="start" font-style="italic">seven: flip</text><rect x="22" y="338" width="14" height="10" rx="2" fill="#e4e4e7"/><rect x="40" y="338" width="14" height="10" rx="2" fill="#e4e4e7"/><rect x="58" y="338" width="14" height="10" rx="2" fill="#e4e4e7"/><text x="84" y="348" font-size="12.5" font-weight="700" fill="#f2f3f5" text-anchor="start">Palm hold</text><text x="190" y="348" font-size="11.5" font-weight="400" fill="#f2f3f5" text-anchor="start">Lock input until 1× tap + hold or the charger</text><rect x="22" y="372" width="556" height="1" rx="0" fill="#3a3f47"/><text x="22" y="390" font-size="10.5" font-weight="400" fill="#9aa1ac" text-anchor="start">Any trackpad touch cancels. Red counts reboot, wipe, or update the ring.</text></svg>
