[project]
name = "prolo-ring"
version = "0.1.0"
description = "Unofficial CLI for reading and configuring a Prolo Ring over Bluetooth LE"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Prateek Rungta", email = "prungta2@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["prolo", "ring", "bluetooth", "ble", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = [
    "bleak>=3.0.2",
]

[project.urls]
Repository = "https://github.com/prateek/prolo-ring"

[project.scripts]
prolo-ring = "prolo_ring:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# Embedded SVG, CSS, and HTML literals cannot be wrapped.
"src/prolo_ring/cheatsheet.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
asyncio_mode = "auto"
